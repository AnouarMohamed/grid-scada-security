[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "power-sim"
version = "0.1.1"
description = "Power track simulation primitives for GridGuard"
requires-python = ">=3.11"
dependencies = [
    "msgpack==1.2.2",
    "pandapower==3.5.4",
    "pymodbus==3.15.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
