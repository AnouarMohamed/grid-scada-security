<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 1440 860" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="gge-title gge-desc">
  <title id="gge-title">GridGuard single-cluster Amazon EKS segmentation architecture</title>
  <desc id="gge-desc">One temporary Amazon EKS cluster spans two private subnets. Three default-deny Kubernetes namespaces separate the OT simulator, Modbus ingestion, and observability workloads. Explicit network policies allow only DNS, Modbus TCP 1502, InfluxDB TCP 8086, and operator access to Grafana TCP 3000. Private VPC endpoints pull four digest-pinned images from ECR without a NAT gateway.</desc>
  <defs>
    <marker id="gge-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#2563EB"/>
    </marker>
    <style>
      .title{font:400 32px Georgia,serif;fill:#14221B}.subtitle{font:400 14px Inter,"Segoe UI",Arial,sans-serif;fill:#53645A}.eyebrow{font:600 10px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#53645A}.zone{fill:#FFFFFF;fill-opacity:.72;stroke:#87958C;stroke-width:1}.cluster{fill:#ED7100;fill-opacity:.025;stroke:#ED7100;stroke-width:1.5;stroke-dasharray:7 6}.ns-ot{fill:#C2413A;fill-opacity:.035;stroke:#C2413A;stroke-width:1.5}.ns-ingest{fill:#0B7A53;fill-opacity:.04;stroke:#0B7A53;stroke-width:1.5}.ns-obs{fill:#2563EB;fill-opacity:.035;stroke:#2563EB;stroke-width:1.5}.node{fill:#FFFFFF;stroke:#87958C;stroke-width:1}.node-title{font:600 14px Inter,"Segoe UI",Arial,sans-serif;fill:#14221B}.node-sub{font:400 11px Inter,"Segoe UI",Arial,sans-serif;fill:#53645A}.mono{font:500 10px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#405148}.flow{fill:none;stroke:#2563EB;stroke-width:2.2;marker-end:url(#gge-arrow)}.support{fill:none;stroke:#53645A;stroke-width:1.4;stroke-dasharray:5 4;marker-end:url(#gge-arrow)}.deny{fill:none;stroke:#C2413A;stroke-width:1.5;stroke-dasharray:5 4}.label{font:600 10px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#405148}.legend{font:500 11px Inter,"Segoe UI",Arial,sans-serif;fill:#53645A}
    </style>
  </defs>
  <rect width="1440" height="860" fill="#F7F8F5"/>
  <text x="40" y="52" class="eyebrow">AWS / SINGLE REAL CLOUD CLUSTER / TEMPORARY EVIDENCE ENVIRONMENT</text>
  <text x="40" y="88" class="title">Default-deny namespaces around one narrow OT bridge</text>
  <text x="40" y="116" class="subtitle">Private workers in two availability zones; no NAT gateway, public node address, LoadBalancer, or NodePort.</text>

  <rect x="40" y="148" width="1360" height="100" rx="8" class="zone"/>
  <rect x="56" y="140" width="214" height="20" fill="#F7F8F5"/>
  <text x="64" y="154" class="eyebrow">AWS REGIONAL SERVICES</text>
  <rect x="96" y="172" width="270" height="52" rx="6" class="node"/>
  <image href="data:image/svg+xml;base64," x="111" y="182" width="32" height="32"/>
  <text x="157" y="193" class="node-title">Amazon EKS 1.36</text>
  <text x="157" y="211" class="node-sub">managed control plane · audit logs</text>
  <rect x="1074" y="172" width="270" height="52" rx="6" class="node"/>
  <image href="data:image/svg+xml;base64," x="1089" y="182" width="32" height="32"/>
  <text x="1135" y="193" class="node-title">Amazon ECR · 4 images</text>
  <text x="1135" y="211" class="node-sub">private · immutable · digest-pinned</text>

  <rect x="40" y="276" width="1360" height="500" rx="8" class="zone"/>
  <rect x="56" y="268" width="190" height="20" fill="#F7F8F5"/>
  <text x="64" y="282" class="eyebrow">VPC 10.40.0.0/16</text>
  <rect x="72" y="324" width="190" height="142" rx="6" class="node"/>
  <text x="88" y="350" class="node-title">PrivateLink endpoints</text>
  <text x="88" y="374" class="mono">EC2 · ECR API/DKR</text>
  <text x="88" y="394" class="mono">EKS · Logs · STS</text>
  <text x="88" y="414" class="mono">S3 gateway</text>
  <text x="88" y="446" class="node-sub">TLS from worker subnets only</text>

  <rect x="290" y="308" width="1078" height="430" rx="8" class="cluster"/>
  <rect x="310" y="300" width="330" height="20" fill="#F7F8F5"/>
  <text x="318" y="314" class="eyebrow">EKS CLUSTER · gridguard-aws-eks-lab</text>
  <path d="M262 395H290" class="support"/>
  <path d="M1080 224V276H1210V308" class="support"/>
  <path d="M546 505H630" class="flow"/>
  <path d="M846 505H930" class="flow"/>
  <path d="M1218 490V558H1126V544" class="flow"/>
  <rect x="562" y="488" width="52" height="20" fill="#F7F8F5"/>
  <text x="588" y="501" class="label" text-anchor="middle">:1502</text>
  <rect x="862" y="488" width="52" height="20" fill="#F7F8F5"/>
  <text x="888" y="501" class="label" text-anchor="middle">:8086</text>
  <rect x="1146" y="548" width="52" height="20" fill="#F7F8F5"/>
  <text x="1172" y="561" class="label" text-anchor="middle">:8086</text>

  <rect x="336" y="392" width="210" height="226" rx="6" class="ns-ot"/>
  <text x="352" y="418" class="eyebrow" fill="#C2413A">gridguard-ot</text>
  <rect x="362" y="466" width="158" height="78" rx="5" class="node"/>
  <circle cx="441" cy="486" r="10" fill="#C2413A"/>
  <text x="441" y="490" text-anchor="middle" font-family="Arial" font-size="9" font-weight="700" fill="#FFFFFF">OT</text>
  <text x="441" y="516" class="node-title" text-anchor="middle">Power simulator</text>
  <text x="441" y="534" class="mono" text-anchor="middle">TCP/1502 · 1 pod</text>
  <text x="352" y="584" class="node-sub">default deny ingress + egress</text>

  <rect x="630" y="392" width="216" height="226" rx="6" class="ns-ingest"/>
  <text x="646" y="418" class="eyebrow" fill="#0B7A53">gridguard-ingestion</text>
  <rect x="656" y="466" width="164" height="78" rx="5" class="node"/>
  <circle cx="738" cy="486" r="10" fill="#0B7A53"/>
  <text x="738" y="490" text-anchor="middle" font-family="Arial" font-size="8" font-weight="700" fill="#FFFFFF">ING</text>
  <text x="738" y="516" class="node-title" text-anchor="middle">Modbus ingestor</text>
  <text x="738" y="534" class="mono" text-anchor="middle">only OT bridge · 1 pod</text>
  <text x="646" y="584" class="node-sub">default deny ingress + egress</text>

  <rect x="930" y="382" width="382" height="246" rx="6" class="ns-obs"/>
  <text x="946" y="408" class="eyebrow" fill="#2563EB">gridguard-observability</text>
  <rect x="956" y="466" width="170" height="78" rx="5" class="node"/>
  <image href="data:image/svg+xml;base64," x="1029" y="474" width="24" height="24"/>
  <text x="1041" y="516" class="node-title" text-anchor="middle">InfluxDB</text>
  <text x="1041" y="534" class="mono" text-anchor="middle">TCP/8086 · 1 pod</text>
  <rect x="1150" y="412" width="136" height="78" rx="5" class="node"/>
  <circle cx="1218" cy="432" r="10" fill="#F05A28"/>
  <text x="1218" y="436" text-anchor="middle" font-family="Arial" font-size="8" font-weight="700" fill="#FFFFFF">G</text>
  <text x="1218" y="462" class="node-title" text-anchor="middle">Grafana</text>
  <text x="1218" y="480" class="mono" text-anchor="middle">TCP/3000 · 1 pod</text>
  <text x="946" y="594" class="node-sub">default deny ingress + egress</text>

  <text x="318" y="684" class="node-title">Managed node group · 2 × t3.medium On-Demand · private subnets us-east-1a + us-east-1b</text>
  <text x="318" y="704" class="mono">PODS SCHEDULE ACROSS BOTH WORKERS · VPC CNI STRICT MODE · CLUSTERIP SERVICES ONLY</text>
  <path d="M430 650H1180" class="deny"/>
  <text x="805" y="644" class="label" text-anchor="middle" fill="#C2413A">ALL UNDECLARED EAST-WEST PATHS DENIED</text>

  <rect x="40" y="800" width="1360" height="36" rx="6" fill="#FFFFFF" stroke="#CDD5CF"/>
  <text x="64" y="823" class="legend"><tspan font-weight="600" fill="#2563EB">ALLOW</tspan><tspan dx="12">DNS · ingestor→simulator :1502 · ingestor/Grafana→InfluxDB :8086 · operator→Grafana :3000</tspan></text>
  <text x="1376" y="823" class="legend" text-anchor="end">Source: infra/kubernetes + aws-eks-lab Terraform</text>
</svg>
