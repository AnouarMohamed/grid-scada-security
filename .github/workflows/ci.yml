name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Validate repository hygiene
        run: bash scripts/ci/validate-repo-hygiene.sh

      - name: Validate documentation
        run: bash scripts/ci/validate-docs.sh

  python:
    name: Python ${{ matrix.python-version }} Lint, Test, and SAST
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            **/requirements*.txt
            pyproject.toml
            **/pyproject.toml

      - name: Validate Python
        run: bash scripts/ci/validate-python.sh

      - name: Validate GitHub Actions workflows
        if: ${{ matrix.python-version == '3.12' }}
        run: bash scripts/ci/validate-workflows.sh

      - name: Validate Modbus contracts
        if: ${{ matrix.python-version == '3.12' }}
        run: bash scripts/ci/validate-modbus-contracts.sh

  terraform:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4

      - name: Validate Terraform
        run: bash scripts/ci/validate-terraform.sh

  docker:
    name: Docker and Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Validate Docker artifacts
        run: bash scripts/ci/validate-docker.sh

      - name: Report power simulator image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v0.70.0
          image-ref: gridguard-ci-power-sim-dockerfile:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Report remaining image vulnerabilities and enforce critical gate
        run: |
          report_images=(
            gridguard-ci-infra-services-modbus-ingestor-dockerfile:latest
            gridguard-ci-infra-services-fake-telemetry-dockerfile:latest
            gridguard-ci-infra-images-grafana-dockerfile:latest
            gridguard-ci-infra-images-influxdb-dockerfile:latest
          )
          for image in "${report_images[@]}"; do
            trivy image \
              --exit-code 0 \
              --ignore-unfixed \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --skip-version-check \
              "${image}"
          done

          gate_images=(
            gridguard-ci-power-sim-dockerfile:latest
            "${report_images[@]}"
          )
          for image in "${gate_images[@]}"; do
            trivy image \
              --exit-code 1 \
              --scanners vuln \
              --severity CRITICAL \
              --skip-version-check \
              "${image}"
          done

  security:
    name: Secrets and Dependency Scans
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan filesystem for vulnerabilities and IaC risk
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs:
      - hygiene
      - python
      - terraform
      - docker
      - security
    if: always()
    steps:
      - name: Require all CI jobs to pass
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi
          echo "All CI jobs passed."
