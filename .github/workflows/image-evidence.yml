name: Signed Image SBOM Evidence

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: image-evidence-sandbox
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  evidence:
    name: ${{ matrix.component }} SBOM and Scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: sandbox
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: power-sim
            repository: gridguard-aws-sandbox/power-sim
            digest: sha256:f51d3dd888b3a2a2855bbba40725357a92d91c2a9bd6660fdd8a5a39505a9451
          - component: modbus-ingestor
            repository: gridguard-aws-sandbox/modbus-ingestor
            digest: sha256:18e13b46ed9fe4d89290ae8219b6cd897e3a8e3c6675f3069541779b49e2caa7
          - component: influxdb
            repository: gridguard-aws-sandbox/influxdb
            digest: sha256:359adac56f03b03f1b7072cc2d34bd0a49262e920961ed74cb490ea6a21d8fb0
          - component: grafana
            repository: gridguard-aws-sandbox/grafana
            digest: sha256:1fbc7b35e2e71e9ccf8178dc7b05369bc85a9000320ee40031743a868f566c5c
    env:
      AWS_ACCOUNT_ID: "227755136916"
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_IMAGE_EVIDENCE_ROLE_TO_ASSUME: ${{ secrets.AWS_IMAGE_EVIDENCE_ROLE_TO_ASSUME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Require sandbox evidence inputs
        run: |
          if [[ -z "${AWS_IMAGE_EVIDENCE_ROLE_TO_ASSUME}" ]]; then
            echo "::error::AWS_IMAGE_EVIDENCE_ROLE_TO_ASSUME is required."
            exit 1
          fi
          if [[ "${AWS_REGION}" != "us-east-1" ]]; then
            echo "::error::Image evidence is pinned to us-east-1."
            exit 1
          fi

      - name: Configure read-only AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c  # v6.2.4
        with:
          role-to-assume: ${{ env.AWS_IMAGE_EVIDENCE_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "227755136916"
          mask-aws-account-id: true
          role-session-name: gridguard-evidence-${{ github.run_id }}
          retry-max-attempts: 3

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd  # v2.1.7
        with:
          mask-password: true

      - name: Pull and verify immutable runnable image
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          expected_registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          if [[ "${REGISTRY}" != "${expected_registry}" ]]; then
            echo "::error::Unexpected ECR registry: ${REGISTRY}"
            exit 1
          fi

          subject_name="${REGISTRY}/${{ matrix.repository }}"
          image_ref="${subject_name}@${{ matrix.digest }}"
          docker pull --platform linux/amd64 "${image_ref}"

          repo_digests="$(docker image inspect "${image_ref}" \
            --format '{{range .RepoDigests}}{{println .}}{{end}}')"
          if ! grep --fixed-strings --line-regexp --quiet \
            "${image_ref}" <<< "${repo_digests}"; then
            echo "::error::Pulled image does not expose the expected repository digest."
            exit 1
          fi
          image_platform="$(docker image inspect "${image_ref}" \
            --format '{{.Os}}/{{.Architecture}}')"
          if [[ "${image_platform}" != "linux/amd64" ]]; then
            echo "::error::Unexpected image platform: ${image_platform}"
            exit 1
          fi

          mkdir -p evidence
          echo "image-ref=${image_ref}" >> "${GITHUB_OUTPUT}"
          echo "subject-name=${subject_name}" >> "${GITHUB_OUTPUT}"

      - name: Remove AWS and registry credentials
        if: always()
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          if [[ -n "${REGISTRY}" ]]; then
            docker logout "${REGISTRY}" || true
          fi
          {
            echo "AWS_ACCESS_KEY_ID="
            echo "AWS_SECRET_ACCESS_KEY="
            echo "AWS_SESSION_TOKEN="
          } >> "${GITHUB_ENV}"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          image: ${{ steps.image.outputs.image-ref }}
          format: spdx-json
          output-file: evidence/${{ matrix.component }}.spdx.json
          syft-version: v1.51.1
          dependency-snapshot: false
          upload-artifact: false

      - name: Scan exact image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ steps.image.outputs.image-ref }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: json
          output: evidence/${{ matrix.component }}.trivy.json
          exit-code: "0"

      - name: Validate and summarize evidence
        id: evidence
        run: |
          sbom="evidence/${{ matrix.component }}.spdx.json"
          report="evidence/${{ matrix.component }}.trivy.json"
          summary="evidence/${{ matrix.component }}.summary.json"

          jq -e '
            .spdxVersion == "SPDX-2.3" and
            (.packages | type == "array" and length > 0) and
            (.creationInfo.creators | any(. == "Tool: syft-1.51.1"))
          ' "${sbom}" > /dev/null
          if (( $(wc -c < "${sbom}") > 16 * 1024 * 1024 )); then
            echo "::error::SBOM exceeds the GitHub attestation size limit."
            exit 1
          fi

          critical="$(jq '[.Results[]?.Vulnerabilities[]? |
            select(.Severity == "CRITICAL")] | length' "${report}")"
          high="$(jq '[.Results[]?.Vulnerabilities[]? |
            select(.Severity == "HIGH")] | length' "${report}")"
          unique_high="$(jq '[.Results[]?.Vulnerabilities[]? |
            select(.Severity == "HIGH") | .VulnerabilityID] |
            unique | length' "${report}")"
          fixed_high="$(jq '[.Results[]?.Vulnerabilities[]? |
            select(.Severity == "HIGH" and (.FixedVersion // "") != "") |
            .VulnerabilityID] | unique | length' "${report}")"
          unfixed_high="$(jq '[.Results[]?.Vulnerabilities[]? |
            select(.Severity == "HIGH" and (.FixedVersion // "") == "") |
            .VulnerabilityID] | unique | length' "${report}")"

          jq -e \
            --arg imageRef "${{ steps.image.outputs.image-ref }}" \
            '.Trivy.Version == "0.74.0" and
            (.Metadata.RepoDigests | index($imageRef)) != null' \
            "${report}" > /dev/null

          jq -n \
            --arg component "${{ matrix.component }}" \
            --arg subjectName "${{ steps.image.outputs.subject-name }}" \
            --arg subjectDigest "${{ matrix.digest }}" \
            --arg repositoryCommit "${GITHUB_SHA}" \
            --argjson critical "${critical}" \
            --argjson high "${high}" \
            --argjson uniqueHigh "${unique_high}" \
            --argjson fixedHigh "${fixed_high}" \
            --argjson unfixedHigh "${unfixed_high}" \
            '{
              schemaVersion: 1,
              component: $component,
              subject: {name: $subjectName, digest: $subjectDigest},
              repositoryCommit: $repositoryCommit,
              scan: {
                severity: ["HIGH", "CRITICAL"],
                ignoreUnfixed: false,
                critical: $critical,
                high: $high,
                uniqueHigh: $uniqueHigh,
                fixedUniqueHigh: $fixedHigh,
                unfixedUniqueHigh: $unfixedHigh
              }
            }' > "${summary}"

          echo "critical-count=${critical}" >> "${GITHUB_OUTPUT}"

      - name: Sign and store SBOM attestation
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.subject-name }}
          subject-digest: ${{ matrix.digest }}
          sbom-path: evidence/${{ matrix.component }}.spdx.json

      - name: Stage and validate attestation bundle
        run: |
          bundle="evidence/${{ matrix.component }}.attestation.json"
          cp "${{ steps.attest.outputs.bundle-path }}" "${bundle}"
          jq -e '
            .mediaType == "application/vnd.dev.sigstore.bundle.v0.3+json" and
            (.dsseEnvelope.signatures | length) == 1 and
            (.verificationMaterial.tlogEntries | length) >= 1 and
            (.verificationMaterial.certificate.rawBytes | length) > 0
          ' "${bundle}" > /dev/null

      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: image-evidence-${{ matrix.component }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Enforce zero-critical release gate
        if: always() && steps.evidence.outcome == 'success'
        run: |
          if [[ "${{ steps.evidence.outputs.critical-count }}" != "0" ]]; then
            echo "::error::Exact release image contains a critical finding."
            exit 1
          fi
