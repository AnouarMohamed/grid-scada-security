name: Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action to run.
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      environment:
        description: GitHub environment to target.
        required: true
        default: sandbox
        type: choice
        options:
          - sandbox
          - staging
          - production
      terraform_root:
        description: Terraform environment root to plan or apply.
        required: true
        default: infra/terraform/environments/aws-sandbox
        type: choice
        options:
          - infra/terraform/environments/aws-sandbox
          - infra/terraform/environments/local-dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  terraform:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'gridguard/aws-sandbox/terraform.tfstate' }}
      TF_VARS_JSON: ${{ vars.TF_VARS_JSON }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Guard production applies
        if: ${{ inputs.action == 'apply' }}
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Terraform apply is only allowed from main."
            exit 1
          fi

      - name: Require AWS OIDC role for AWS sandbox
        if: ${{ inputs.terraform_root == 'infra/terraform/environments/aws-sandbox' }}
        run: |
          if [[ -z "${AWS_ROLE_TO_ASSUME}" ]]; then
            echo "::error::AWS_ROLE_TO_ASSUME is required for the AWS sandbox."
            exit 1
          fi
          if [[ -z "${TF_STATE_BUCKET}" ]]; then
            echo "::error::TF_STATE_BUCKET is required for durable AWS Terraform state."
            exit 1
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Configure AWS credentials through OIDC
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate selected Terraform root
        id: terraform-root
        env:
          TERRAFORM_ROOT: ${{ inputs.terraform_root }}
        run: |
          case "${TERRAFORM_ROOT}" in
            infra/terraform/environments/aws-sandbox|infra/terraform/environments/local-dev)
              ;;
            *)
              echo "::error::Terraform root is not allow-listed: ${TERRAFORM_ROOT}"
              exit 1
              ;;
          esac
          if [[ ! -d "${TERRAFORM_ROOT}" ]]; then
            echo "::error::Terraform root does not exist: ${TERRAFORM_ROOT}"
            exit 1
          fi
          echo "root=${TERRAFORM_ROOT}" >> "${GITHUB_OUTPUT}"

      - name: Prepare AWS Terraform inputs
        id: terraform-inputs
        if: ${{ inputs.terraform_root == 'infra/terraform/environments/aws-sandbox' }}
        run: |
          root="${{ steps.terraform-root.outputs.root }}"
          terraform -chdir="${root}" init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

          if [[ -n "${TF_VARS_JSON}" ]]; then
            variable_file="${RUNNER_TEMP}/aws-sandbox.auto.tfvars.json"
            if ! jq -e 'type == "object"' <<< "${TF_VARS_JSON}" > /dev/null; then
              echo "::error::TF_VARS_JSON must be a valid JSON object."
              exit 1
            fi
            printf '%s\n' "${TF_VARS_JSON}" > "${variable_file}"
            echo "variable_file=${variable_file}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Initialize non-AWS Terraform root
        if: ${{ inputs.terraform_root != 'infra/terraform/environments/aws-sandbox' }}
        run: |
          root="${{ steps.terraform-root.outputs.root }}"
          terraform -chdir="${root}" init -input=false

      - name: Terraform plan
        run: |
          root="${{ steps.terraform-root.outputs.root }}"
          variable_file="${{ steps.terraform-inputs.outputs.variable_file }}"
          if [[ "${{ inputs.terraform_root }}" == "infra/terraform/environments/aws-sandbox" ]]; then
            export TF_VAR_aws_region="${AWS_REGION}"
          fi
          if [[ -n "${variable_file}" ]]; then
            terraform -chdir="${root}" plan -input=false -var-file="${variable_file}" -out=tfplan
          else
            terraform -chdir="${root}" plan -input=false -out=tfplan
          fi

      - name: Terraform apply
        if: ${{ inputs.action == 'apply' }}
        run: |
          root="${{ steps.terraform-root.outputs.root }}"
          terraform -chdir="${root}" apply -input=false -auto-approve tfplan
