name: AWS Sandbox Plan

on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write

concurrency:
  group: plan-sandbox
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  terraform:
    name: Terraform Plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: sandbox
    env:
      TERRAFORM_ROOT: infra/terraform/environments/aws-sandbox
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'gridguard/aws-sandbox/terraform.tfstate' }}
      TF_STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
      TF_VARS_JSON: ${{ vars.TF_VARS_JSON }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Require sandbox deployment inputs
        run: |
          if [[ -z "${AWS_ROLE_TO_ASSUME}" ]]; then
            echo "::error::AWS_ROLE_TO_ASSUME is required for the AWS sandbox."
            exit 1
          fi
          if [[ -z "${TF_STATE_BUCKET}" ]]; then
            echo "::error::TF_STATE_BUCKET is required for durable AWS Terraform state."
            exit 1
          fi
          if [[ -z "${TF_STATE_KMS_KEY_ARN}" ]]; then
            echo "::error::TF_STATE_KMS_KEY_ARN is required for encrypted AWS Terraform state."
            exit 1
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c  # v6.2.4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "227755136916"
          mask-aws-account-id: true
          role-session-name: gridguard-plan-${{ github.run_id }}
          retry-max-attempts: 3

      - name: Prepare AWS Terraform inputs
        id: terraform-inputs
        run: |
          terraform -chdir="${TERRAFORM_ROOT}" init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="kms_key_id=${TF_STATE_KMS_KEY_ARN}" \
            -backend-config="use_lockfile=true"

          if [[ -n "${TF_VARS_JSON}" ]]; then
            variable_file="${RUNNER_TEMP}/aws-sandbox.auto.tfvars.json"
            if ! jq -e 'type == "object"' <<< "${TF_VARS_JSON}" > /dev/null; then
              echo "::error::TF_VARS_JSON must be a valid JSON object."
              exit 1
            fi
            printf '%s\n' "${TF_VARS_JSON}" > "${variable_file}"
            echo "variable_file=${variable_file}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Terraform plan
        run: |
          variable_file="${{ steps.terraform-inputs.outputs.variable_file }}"
          export TF_VAR_aws_region="${AWS_REGION}"
          if [[ -n "${variable_file}" ]]; then
            terraform -chdir="${TERRAFORM_ROOT}" plan \
              -lock-timeout=5m \
              -var-file="${variable_file}" \
              -out=tfplan
          else
            terraform -chdir="${TERRAFORM_ROOT}" plan \
              -lock-timeout=5m \
              -out=tfplan
          fi
