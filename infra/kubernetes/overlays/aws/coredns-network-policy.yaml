apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-coredns-aws-runtime
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      k8s-app: kube-dns
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - ipBlock:
            cidr: 10.40.10.0/24
        - ipBlock:
            cidr: 10.40.11.0/24
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8181
  egress:
    - to:
        - ipBlock:
            cidr: 172.20.0.1/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 10.40.0.2/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
